[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlfeat"
version = "0.1.0"
description = "Point-in-time SQL feature engineering for relational event data, with leakage sentinels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dr. Pavanam Thomas", email = "thomaspavanam@gmail.com" },
]
keywords = [
    "feature-engineering",
    "SQL",
    "point-in-time",
    "leakage",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "pytest>=7.4",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]

[project.urls]
Homepage = "https://github.com/pavanamthomas/sql-ml-feature-engineering-lab"
Repository = "https://github.com/pavanamthomas/sql-ml-feature-engineering-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
